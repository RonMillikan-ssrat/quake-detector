# Message bus. No persistence: streams are short-lived buffers, and every service
# reads only new entries after a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: quake
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: quake
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
