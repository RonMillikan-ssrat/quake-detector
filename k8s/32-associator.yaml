# Picks -> events -> Postgres. Singleton (must see every pick), so Recreate like ingest.
# PG_DSN is assembled from the Secret: Kubernetes expands $(VAR) in an env value when
# VAR is defined earlier in the same env list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: associator
  namespace: quake
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: associator}
  template:
    metadata:
      labels: {app: associator}
      annotations:                       # Prometheus discovers pods by these
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: associator
          image: quake-detector:latest
          imagePullPolicy: Never
          command: [python, -m, services.associator]
          envFrom: [{configMapRef: {name: qd-config}}]
          env:
            - name: PG_USER
              valueFrom: {secretKeyRef: {name: pg, key: POSTGRES_USER}}
            - name: PG_PASSWORD
              valueFrom: {secretKeyRef: {name: pg, key: POSTGRES_PASSWORD}}
            - name: PG_DSN
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@postgres:5432/quake
          ports: [{name: metrics, containerPort: 9100}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          # Startup probe: checked every 10 s, up to 60 times (10 min), until the first
          # heartbeat is fresh. Liveness is not checked until this passes, so a slow start
          # (station list retries, waiting for postgres or ingest) is not mistaken for a hang.
          startupProbe:
            exec:
              command: [sh, -c, 'test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60']
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [sh, -c, 'test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60']
            periodSeconds: 30
